name: debug schema introspection

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate the real lib.py functions end to end
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from lib import merged_prs_by_repo, commit_language_weights

          repos = merged_prs_by_repo()
          print("merged_prs_by_repo():")
          for name, info in repos.items():
              print(f"  {name}: {info['count']} merged PRs")

          weights, colors = commit_language_weights()
          total = sum(weights.values())
          print("commit_language_weights():")
          for name, w in sorted(weights.items(), key=lambda kv: -kv[1]):
              print(f"  {name}: {w:.2f} ({w/total*100:.1f}%) color={colors[name]}")
          PY
