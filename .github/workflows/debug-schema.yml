name: debug schema introspection

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Test corrected commit-count query against real data
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from lib import gql, USERNAME

          Q = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                commitContributionsByRepository(maxRepositories: 100) {
                  contributions(first: 100) {
                    totalCount
                    nodes { commitCount occurredAt }
                  }
                  repository { nameWithOwner isPrivate }
                }
              }
            }
          }
          """
          data = gql(Q, {"login": USERNAME, "from": "2026-01-01T00:00:00Z", "to": "2026-08-03T00:00:00Z"})
          cc = data["data"]["user"]["contributionsCollection"]["commitContributionsByRepository"]
          for entry in cc:
              repo = entry["repository"]
              contrib = entry["contributions"]
              summed = sum(n["commitCount"] for n in contrib["nodes"])
              print(f"{repo['nameWithOwner']!r} private={repo['isPrivate']} "
                    f"connection.totalCount={contrib['totalCount']} "
                    f"sum(node.commitCount)={summed} "
                    f"num_nodes={len(contrib['nodes'])}")
          PY
