name: validate profile scripts

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/contributions.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Compile check
        run: python -m py_compile .github/scripts/*.py
      - name: Smoke test rendering with fake data
        env:
          GH_TOKEN: dry-run
          GH_USERNAME: octocat
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          import update_profile as up

          repos = {"owner/repo": {"count": 2, "url": "https://github.com/owner/repo"}}
          weights = {"Python": 60.0, "Rust": 40.0}
          colors = {"Python": "#3572A5", "Rust": "#dea584"}

          block = up.render_contrib_table(repos)
          assert "owner/repo" in block, "contrib table missing repo row"

          langs = up.render_language_cards(weights, colors)
          assert langs and langs[0][0] == "Python", "language ranking looks wrong"

          up.render_stats_strip(len(repos), 2, langs[0][0])
          print("OK")
          PY
