name: update profile data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Update, commit, and push (retries on a push race)
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          for attempt in 1 2 3 4 5; do
            python .github/scripts/update_profile.py
            git add assets/languages.svg assets/languages-light.svg assets/stats.svg assets/stats-light.svg assets/orbit.svg assets/orbit-light.svg
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "chore: update open source contributions and profile stats"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) - another push landed on main first, syncing and retrying"
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
