name: update profile data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Update contributions, languages, and stats
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/update_profile.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md assets/languages.svg assets/languages-light.svg assets/stats.svg assets/stats-light.svg
          git diff --cached --quiet || git commit -m "chore: update open source contributions and profile stats"
          git push
