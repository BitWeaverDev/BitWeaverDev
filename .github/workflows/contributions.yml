name: update profile data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch contributed repositories
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/update_contributions.py
      - name: Generate languages card
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/update_languages.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md assets/languages.svg assets/languages-light.svg
          git diff --cached --quiet || git commit -m "chore: update open source contributions and language stats"
          git push
