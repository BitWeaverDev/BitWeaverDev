<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BitWeaverDev banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0d1730"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7">
        <animate attributeName="stop-color" values="#2E9EF7;#5eead4;#a78bfa;#2E9EF7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5eead4">
        <animate attributeName="stop-color" values="#5eead4;#a78bfa;#2E9EF7;#5eead4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2E9EF7">
        <animate attributeName="stop-color" values="#2E9EF7;#5eead4;#a78bfa;#2E9EF7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="276" rx="18" fill="none" stroke="#2E9EF7" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#5eead4" stroke-opacity="0.9" stroke-width="2.5" fill="none">
    <path d="M22,20 L22,38 M22,20 L40,20"/>
    <path d="M1178,20 L1178,38 M1178,20 L1160,20"/>
    <path d="M22,260 L22,242 M22,260 L40,260"/>
    <path d="M1178,260 L1178,242 M1178,260 L1160,260"/>
  </g>

  <g stroke="#2E9EF7" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M0,40 H200 V80 H420 V30"/>
    <path d="M1200,60 H980 V20 H760 V70"/>
    <path d="M0,220 H160 V180 H360"/>
    <path d="M1200,230 H1040 V190 H860 V240"/>
    <path d="M480,0 V50 H620 V0"/>
    <path d="M520,280 V230 H700 V280"/>
  </g>
  <g fill="#5eead4" fill-opacity="0.55">
    <circle cx="200" cy="40" r="3"/>
    <circle cx="420" cy="80" r="3"/>
    <circle cx="980" cy="60" r="3"/>
    <circle cx="760" cy="70" r="3"/>
    <circle cx="160" cy="220" r="3"/>
    <circle cx="360" cy="180" r="3"/>
    <circle cx="1040" cy="230" r="3"/>
    <circle cx="860" cy="240" r="3"/>
  </g>

  <g stroke="#5eead4" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="900" y1="60" x2="1020" y2="40"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="1020" y1="40" x2="1100" y2="110"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="900" y1="60" x2="950" y2="150"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="950" y1="150" x2="1080" y2="200"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="950" y1="150" x2="870" y2="210"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="1100" y1="110" x2="1080" y2="200"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.3s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#5eead4">
    <circle cx="900" cy="60" r="4"><animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="40" r="4"><animate attributeName="r" values="4;6;4" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="110" r="4"><animate attributeName="r" values="4;6;4" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="150" r="4"><animate attributeName="r" values="4;6;4" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="200" r="4"><animate attributeName="r" values="4;6;4" dur="2.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="210" r="4"><animate attributeName="r" values="4;6;4" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="-20" y="0" width="6" height="280" fill="url(#scanGrad)" filter="url(#glow)">
    <animate attributeName="x" from="-20" to="1220" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1220" y="0" width="6" height="280" fill="url(#scanGrad)" filter="url(#glow)" opacity="0.5">
    <animate attributeName="x" from="1220" to="-20" dur="7s" begin="1.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(60,88)" filter="url(#glow)">
    <path d="M40 0 L78 14 V46 C78 74 58 92 40 100 C22 92 2 74 2 46 V14 Z" fill="#0d1730" stroke="url(#textGrad)" stroke-width="3"/>
    <path d="M24 48 L36 60 L58 34" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="180" y="118" font-family="'JetBrains Mono','Fira Code',monospace" font-size="46" font-weight="700" fill="url(#textGrad)">BitWeaverDev</text>
  <text x="180" y="152" font-family="'JetBrains Mono','Fira Code',monospace" font-size="17" fill="#8b98a5">root@zero-trust:~$ securing distributed systems at scale</text>
  <rect x="655" y="139" width="9" height="16" fill="#5eead4">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600">
    <g transform="translate(180,178)">
      <rect width="92" height="28" rx="14" fill="#132339" stroke="#2E9EF7" stroke-width="1"/>
      <text x="46" y="19" text-anchor="middle" fill="#5eead4">PYTHON</text>
    </g>
    <g transform="translate(284,178)">
      <rect width="70" height="28" rx="14" fill="#132339" stroke="#2E9EF7" stroke-width="1"/>
      <text x="35" y="19" text-anchor="middle" fill="#5eead4">RUST</text>
    </g>
    <g transform="translate(366,178)">
      <rect width="82" height="28" rx="14" fill="#132339" stroke="#2E9EF7" stroke-width="1"/>
      <text x="41" y="19" text-anchor="middle" fill="#5eead4">AZURE</text>
    </g>
    <g transform="translate(460,178)">
      <rect width="128" height="28" rx="14" fill="#132339" stroke="#2E9EF7" stroke-width="1"/>
      <text x="64" y="19" text-anchor="middle" fill="#5eead4">ZERO-TRUST</text>
    </g>
  </g>
</svg>
